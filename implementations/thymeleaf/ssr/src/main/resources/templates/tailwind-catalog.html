<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title
    th:text="${data.title}"></title><link rel="stylesheet" href="/styles.css"></head><body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"><div class="flex flex-col md:flex-row justify-between items-center mb-8"><h1 class="text-3xl font-extrabold tracking-tight text-slate-900"
    th:text="${data.title}"></h1><form action="/search" class="mt-4 md:mt-0 flex w-full md:w-auto"><input type="search" name="q" placeholder="Search projects..." class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"><button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Search</button></form></div><div class="flex space-x-4 mb-8 overflow-x-auto pb-2"><a
    th:each="platform : ${data.platforms}"
    th:href="${'?platform=' + platform.id}"
    th:class="${'px-3 py-2 font-medium text-sm rounded-md ' + (platform.active ? 'bg-indigo-100 text-indigo-700' : 'text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200')}"
    th:text="${platform.name}"></a></div><div
    th:each="section : ${data.sections}" class="mb-12"><h2 class="text-2xl font-bold text-slate-900 mb-6"
    th:text="${section.title}"></h2><div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"><div
    th:each="project : ${section.projects}" class="bg-white overflow-hidden shadow rounded-lg border border-slate-200 flex flex-col"><div class="px-4 py-5 sm:p-6 flex-grow"><div class="flex items-center justify-between mb-4"><span class="text-sm font-medium text-indigo-600"
    th:text="${project.author}"></span><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800"
    th:text="${'★ ' + project.starCount}"></span></div><h3 class="text-lg font-medium text-slate-900 mb-2"
    th:text="${project.name}"></h3><p class="text-sm text-slate-500 line-clamp-3"
    th:text="${project.description}"></p></div><div class="bg-slate-50 px-4 py-4 sm:px-6 flex flex-wrap gap-2"><span
    th:each="badge : ${project.badges}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800 border border-slate-200"
    th:text="${badge}"></span></div></div></div></div><footer class="mt-12 border-t border-slate-200 pt-8 text-center pb-12"><p class="text-sm text-slate-500">© 2024 Compose HTML Benchmarks.</p></footer></div></body></html>
